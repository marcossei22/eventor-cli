name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build primeiro: o @eventor-run/cli resolve os tipos do @eventor-run/sdk a partir
      # do dist/ dele (topológico: sdk antes do cli). Sem isso, typecheck/test
      # falham com "Cannot find module '@eventor-run/sdk'".
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test

      # O SDK gera os tipos a partir de openapi/eventor-v1.json. Falha o CI se o
      # tipo gerado estiver desatualizado em relação ao spec commitado.
      - name: openapi types em dia
        run: |
          pnpm gen
          git diff --exit-code packages/sdk/src/generated/types.ts \
            || (echo "::error::types.ts desatualizado — rode 'pnpm gen' e commite." && exit 1)
